<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GateQ: a Q&A board for GATE CSE questions, organised by subject." />
    <title>GateQ · GATE CSE Q&amp;A</title>
    <meta name="theme-color" content="#070914" />
    <script>
      // Apply the saved theme and accent before first paint so there is no flash.
      try {
        var d = document.documentElement
        d.dataset.theme = localStorage.getItem('gateq-theme') || 'dark'
        d.dataset.accent = localStorage.getItem('gateq-accent') || 'indigo'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
